<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Olena Ahiienko</title>
</head>
<body>
<div class="main-wrapper">
    <div class="main-content">
        <header class="main-header">
            <button class="primary primary-yellow">Кейси</button>
            <button class="primary primary-pink">Резюме</button>
            <button class="primary primary-green">Звʼязатися</button>
        </header>
        <section class="hero-section-wrapper">
            <div class="hero-section">
                <div class="hero-section-left">
                    <h1>ОЛЕНА</h1>
                    <h1>АГІЄНКО</h1>
                    <p>UI/UX designer</p>
                    <button class="hero-section-button">
                        Зазирни в мої думки
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M2.50488 9H17.4946M13.3267 12.5L17.4946 9L13.3267 5.5" stroke="#1A1712"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <div class="hero-section-right">
                    <img src="./bg_photo.png" alt="" class="hero-section-right-bg-photo"/>
                    <img src="./photo.png" alt="" class="hero-section-right-photo"/>
                    <p class="hero-section-text">
                        Мені цікавіше "чому?", ніж "як?". Саме тому я починаю не з макетів, я починаю з запитань
                    </p>
                </div>
            </div>
        </section>
        <section class="learn-projects-wrapper">
            <h2 class="learn-projects-header">Проекти, які мене навчили</h2>
            <div class="learn-projects-card">
                <a target="_blank" class="learn-projects-card-header"
                   href="https://www.figma.com/design/DXl30hqz0p6czuZja7ECA3/Drift-Aegean?node-id=0-1&p=f&t=M3gE4ik2z9SvBlqu-0"
                >
                    Grotti - e-commerce інтернет-магазин
                </a>
                <div class="learn-projects-card-img-wrapper">
                    <img src="./learn-project-scotch.png" alt="" class="learn-projects-card-scotch">
                    <a  target="_blank"
                        href="https://www.figma.com/design/DXl30hqz0p6czuZja7ECA3/Drift-Aegean?node-id=0-1&p=f&t=M3gE4ik2z9SvBlqu-0"
                    >
                        <img src="./grotti-img.png" alt="photo" class="learn-projects-card-img">
                    </a>
                    <div class="learn-project-overlay"></div>
                </div>
            </div>
            <div class="learn-projects-card">
                <a target="_blank" class="learn-projects-card-header"
                   href="https://www.figma.com/design/UJUGWwkrrT1CIBn5sc3E96/e-commerc-Grotti-one-ref-animate?node-id=0-1&p=f&t=fHr4nV9Pt8AQAYmk-0"
                >
                    AegeanDrift - лендінг яхтового туризму
                </a>
                <div class="learn-projects-card-img-wrapper">
                    <img src="./learn-project-scotch.png" alt="" class="learn-projects-card-scotch">
                    <a  target="_blank"
                        href="https://www.figma.com/design/UJUGWwkrrT1CIBn5sc3E96/e-commerc-Grotti-one-ref-animate?node-id=0-1&p=f&t=fHr4nV9Pt8AQAYmk-0"
                    >
                        <img src="./aegean-drift-img.png" alt="photo" class="learn-projects-card-img">
                    </a>
                    <div class="learn-project-overlay"></div>
                </div>
            </div>
        </section>
    </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
